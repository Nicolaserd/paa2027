<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#005433"/><stop offset=".55" stop-color="#00482B"/><stop offset="1" stop-color="#00321E"/></linearGradient>
<radialGradient id="luz" cx="1530" cy="540" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1E7A52" stop-opacity=".55"/><stop offset="1" stop-color="#00482B" stop-opacity="0"/></radialGradient>
<radialGradient id="luz2" cx="380" cy="640" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3E9A70" stop-opacity=".45"/><stop offset="1" stop-color="#00482B" stop-opacity="0"/></radialGradient>
<linearGradient id="cinta" x1="0" x2="1"><stop offset="0" stop-color="#1E6B48"/><stop offset=".5" stop-color="#A9C4B6"/><stop offset="1" stop-color="#1E6B48"/></linearGradient>
<linearGradient id="reflejo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".20"/><stop offset=".35" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/></linearGradient>
<linearGradient id="borde" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".80"/><stop offset=".3" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset=".7" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".45"/></linearGradient>
<linearGradient id="destello" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
<g id="escena">
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect class="luz" width="1920" height="1080" fill="url(#luz)"/>
  <rect class="luz2" width="1920" height="1080" fill="url(#luz2)"/>
  <g><circle cx="1530" cy="540" r="380" fill="none" stroke="#FFFFFF" stroke-opacity="0.070" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="450" fill="none" stroke="#FFFFFF" stroke-opacity="0.066" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="520" fill="none" stroke="#FFFFFF" stroke-opacity="0.062" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="590" fill="none" stroke="#FFFFFF" stroke-opacity="0.058" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="660" fill="none" stroke="#FFFFFF" stroke-opacity="0.054" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="730" fill="none" stroke="#FFFFFF" stroke-opacity="0.050" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="800" fill="none" stroke="#FFFFFF" stroke-opacity="0.046" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="870" fill="none" stroke="#FFFFFF" stroke-opacity="0.042" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="940" fill="none" stroke="#FFFFFF" stroke-opacity="0.038" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="1010" fill="none" stroke="#FFFFFF" stroke-opacity="0.034" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="1080" fill="none" stroke="#FFFFFF" stroke-opacity="0.030" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/></g>
  <g class="diag" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="2">
    <line x1="-40" y1="1080" x2="320" y2="720"/><line x1="20" y1="1080" x2="380" y2="720"/><line x1="80" y1="1080" x2="440" y2="720"/>
  </g>
</g>

<filter id="esm_panel" filterUnits="userSpaceOnUse" x="24" y="424" width="1184" height="520">
  <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="b" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<clipPath id="clip_panel"><rect x="64" y="464" width="1104" height="440" rx="36"/></clipPath>

<filter id="esm_boton" filterUnits="userSpaceOnUse" x="24" y="888" width="340" height="136">
  <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="9" result="n"/>
  <feDisplacementMap in="b" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<clipPath id="clip_boton"><rect x="64" y="928" width="260" height="56" rx="14"/></clipPath>
</defs>
<style>
.g1{transform-origin:1530px 540px;animation:giro 140s linear infinite}
.g2{transform-origin:1530px 540px;animation:giro 200s linear infinite reverse}
.luz{animation:respira 7s ease-in-out infinite}
.luz2{animation:deriva 11s ease-in-out infinite alternate}
.diag{animation:desliza 9s ease-in-out infinite alternate}
.barrido_panel{animation:barrido 8s cubic-bezier(.45,0,.2,1) 1s infinite}
.barrido_boton{animation:barridoBoton 8s cubic-bezier(.45,0,.2,1) 1.6s infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes respira{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes deriva{from{transform:translate(0,0)}to{transform:translate(90px,-40px)}}
@keyframes desliza{from{transform:translateX(0)}to{transform:translateX(26px)}}
@keyframes barrido{0%{transform:translateX(0) skewX(-18deg)}55%,100%{transform:translateX(1620px) skewX(-18deg)}}
@keyframes barridoBoton{0%{transform:translateX(0) skewX(-18deg)}35%,100%{transform:translateX(760px) skewX(-18deg)}}
</style>
<use href="#escena" xlink:href="#escena"/>

<rect x="64" y="464" width="1104" height="440" rx="36" fill="#001A10" opacity="0.38" filter="url(#sombra)" transform="translate(0 16)"/>
<g clip-path="url(#clip_panel)">
  <use href="#escena" xlink:href="#escena" filter="url(#esm_panel)"/>
  <rect x="64" y="464" width="1104" height="440" rx="36" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="64" y="464" width="1104" height="440" rx="36" fill="url(#reflejo)"/>
  <rect class="barrido_panel" x="-356" y="424" width="300" height="520" fill="url(#destello)"/>
</g>
<rect x="64" y="464" width="1104" height="440" rx="36" fill="none" stroke="url(#borde)" stroke-width="1.6"/>
<path d="M 100 465.4 H 1132" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>

<rect x="64" y="928" width="260" height="56" rx="14" fill="#001A10" opacity="0.3" filter="url(#sombra)" transform="translate(0 16)"/>
<g clip-path="url(#clip_boton)">
  <use href="#escena" xlink:href="#escena" filter="url(#esm_boton)"/>
  <rect x="64" y="928" width="260" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="64" y="928" width="260" height="56" rx="14" fill="url(#reflejo)"/>
  <rect class="barrido_boton" x="-356" y="888" width="300" height="136" fill="url(#destello)"/>
</g>
<rect x="64" y="928" width="260" height="56" rx="14" fill="none" stroke="url(#borde)" stroke-width="1.6"/>
<path d="M 78 929.4 H 310" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
<rect y="1068" width="1920" height="12" fill="url(#cinta)"/>
</svg>