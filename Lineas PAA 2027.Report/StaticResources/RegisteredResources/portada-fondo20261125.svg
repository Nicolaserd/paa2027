<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#005433"/><stop offset=".55" stop-color="#00482B"/><stop offset="1" stop-color="#00321E"/></linearGradient>
<radialGradient id="luz" cx="1530" cy="540" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1E7A52" stop-opacity=".55"/><stop offset="1" stop-color="#00482B" stop-opacity="0"/></radialGradient>
<linearGradient id="cinta" x1="0" x2="1"><stop offset="0" stop-color="#1E6B48"/><stop offset=".5" stop-color="#A9C4B6"/><stop offset="1" stop-color="#1E6B48"/></linearGradient>
</defs>
<style>
.g1{transform-origin:1530px 540px;animation:giro 140s linear infinite}
.g2{transform-origin:1530px 540px;animation:giro 200s linear infinite reverse}
.luz{animation:respira 7s ease-in-out infinite}
.diag{animation:desliza 9s ease-in-out infinite alternate}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes respira{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes desliza{from{transform:translateX(0)}to{transform:translateX(26px)}}
</style>
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect class="luz" width="1920" height="1080" fill="url(#luz)"/>
<g><circle cx="1530" cy="540" r="380" fill="none" stroke="#FFFFFF" stroke-opacity="0.070" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="450" fill="none" stroke="#FFFFFF" stroke-opacity="0.066" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="520" fill="none" stroke="#FFFFFF" stroke-opacity="0.062" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="590" fill="none" stroke="#FFFFFF" stroke-opacity="0.058" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="660" fill="none" stroke="#FFFFFF" stroke-opacity="0.054" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="730" fill="none" stroke="#FFFFFF" stroke-opacity="0.050" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="800" fill="none" stroke="#FFFFFF" stroke-opacity="0.046" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="870" fill="none" stroke="#FFFFFF" stroke-opacity="0.042" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="940" fill="none" stroke="#FFFFFF" stroke-opacity="0.038" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/><circle cx="1530" cy="540" r="1010" fill="none" stroke="#FFFFFF" stroke-opacity="0.034" stroke-width="1.2" stroke-dasharray="2 10" class="g1"/><circle cx="1530" cy="540" r="1080" fill="none" stroke="#FFFFFF" stroke-opacity="0.030" stroke-width="1.2" stroke-dasharray="14 8" class="g2"/></g>
<g class="diag" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="2">
<line x1="-40" y1="1080" x2="320" y2="720"/><line x1="20" y1="1080" x2="380" y2="720"/><line x1="80" y1="1080" x2="440" y2="720"/>
</g>
<rect y="1068" width="1920" height="12" fill="url(#cinta)"/>
</svg>